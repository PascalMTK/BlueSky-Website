{% comment %}Usage: {% include "core/_field.html" with field=form.email %}{% endcomment %}
{% load i18n_extra %}
<div class="space-y-1.5">
  <label for="{{ field.id_for_label }}" class="text-sm font-semibold">{% t field.label %}</label>
  {{ field }}
  {% if field.errors %}
    <p class="text-xs font-medium text-red-500">{% t field.errors.0 %}</p>
  {% endif %}
</div>
