{% load static i18n_extra %}
<!doctype html>
<html lang="{{ active_language|default:'fr' }}" class="h-full scroll-smooth antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}{% t "Blue Sky — Transfert d'argent international" %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% t "Blue Sky connecte la RDC, la Zambie, la Namibie, l'Afrique du Sud, le Zimbabwe, le Kenya, l'Ouganda, la Tanzanie et le Malawi pour des transferts d'argent rapides, fiables et sécurisés." %}{% endblock %}">

  <!-- Local favicon (Blue Sky logo mark): keep the first render independent from third-party hosts. -->
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'img/favicon-512.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#0b1930">

  <!-- Editorial type pairing: Fraunces for display headings, Inter for UI/body. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,650;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full font-sans bg-bg text-text transition-colors duration-200">

  <!-- Ambient background: a single, very-low-opacity gradient wash fixed
       behind the entire site, drifting slowly. Not per-section decoration,
       doesn't track the cursor, and freezes under prefers-reduced-motion —
       reads as ambiance, not a visual effect. -->
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- Content Wrapper -->
  <div class="relative z-10 flex min-h-full flex-col">
    <main class="flex-grow flex flex-col">
      {% block body %}{% endblock %}
    </main>
  </div>

  <!-- Global Deferred Scripts -->
  <script src="{% static 'js/motion.js' %}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
