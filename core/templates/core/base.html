{% load static %}
<!doctype html>
<html lang="fr" class="h-full scroll-smooth antialiased dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% block title %}Blue Sky — Transfert d'argent international{% endblock %}</title>
  <meta name="description" content="{% block description %}Blue Sky connecte la RDC, la Zambie, la Namibie, l'Afrique du Sud, le Zimbabwe, le Kenya, l'Ouganda, la Tanzanie et le Malawi pour des transferts d'argent rapides, fiables et sécurisés.{% endblock %}">

  <!-- Local favicon (Blue Sky logo mark): keep the first render independent from third-party hosts. -->
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'img/favicon-512.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#0F172A">

  <!-- The stylesheet uses a local system-font stack, so page rendering never
       waits on Google Fonts or another third-party host. -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- Theme Detection & Global CSS Variables Injection -->
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("bluesky-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full flex flex-col font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 selection:bg-amber-400 selection:text-slate-950 transition-colors duration-200">
  
  <!-- Content Wrapper -->
  <main class="flex-grow flex flex-col">
    {% block body %}{% endblock %}
  </main>

  <!-- Global Deferred Scripts -->
  <script src="{% static 'js/theme.js' %}" defer></script>
  <script src="{% static 'js/tilt.js' %}" defer></script>
  <script src="{% static 'js/reveal.js' %}" defer></script>
  <script src="{% static 'js/motion.js' %}" defer></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
